# Dedicated eight-verifier GLM-5.2 4K hidden-state collection profile.
# This profile intentionally contains no trainers. After verify-offline
# succeeds, use a trainer YAML with exactly the same data_path and
# hidden_states_path.
version: 1
cluster_name: glm52-offline-collect-8v-4k

verifier_ips:
  - FILL_VERIFIER_0_IP
  - FILL_VERIFIER_1_IP
  - FILL_VERIFIER_2_IP
  - FILL_VERIFIER_3_IP
  - FILL_VERIFIER_4_IP
  - FILL_VERIFIER_5_IP
  - FILL_VERIFIER_6_IP
  - FILL_VERIFIER_7_IP
trainer_ips:

container_image: quay.io/ascend/vllm-ascend:v0.23.0rc1-a3
# The established Ascend deployment reuses one pre-created container per host.
container_mode: existing
existing_container_name: glm52-w4a8-mg13-speculator-training-lzs
container_name_prefix: glm52-w4a8-mg13-offline-8v-4k
container_repo_path: /mnt/xds/mtp/spec_train/speculators
repo_path: /mnt/xds/mtp/spec_train/speculators
shared_root: /mnt/xds/mtp
nic_name: auto

container_mounts:
  - /mnt/xds/sfs:/mnt/xds/sfs
  - /mnt/xds/mtp:/mnt/xds/mtp
  - /mnt/xds/mtp/spec_train/speculators:/mnt/xds/mtp/spec_train/speculators
  - /root/.cache:/root/.cache

verifier_model_path: /mnt/xds/sfs/l00936201/glm52-w4a8-mg13/v1-ascend-modelslim-v4
verifier_source_model_path: /mnt/xds/sfs/GLM-5.2-W4A8-MG13/v1
verifier_quantization_mode: ascend
mtp_init_model_path: /mnt/xds/sfs/l00936201/glm52-w4a8-mg13/v1-ascend-modelslim-v4

# These paths are deliberately isolated from both the online and 8K caches.
data_path: /mnt/xds/mtp/spec_train/dataset/hf/nuoya-first5-long1-4k
hidden_states_path: /mnt/xds/mtp/spec_train/hidden_states/glm52-w4a8-mg13-offline-4k
output_path: /mnt/xds/mtp/spec_train/ckpts/glm52-w4a8-mg13-4k
log_root: /mnt/xds/mtp/spec_train/logs/glm52-w4a8-mg13-offline-8v-4k

dashboard_host: 0.0.0.0
dashboard_port: 6007
dashboard_auto_start: true

verifier_port: 8077
verifier_dp_size: 1
verifier_tp_size: 16
verifier_block_size: 128
# 4096 prompt tokens plus the one generated token used to export hidden states.
verifier_max_model_len: 4097
verifier_max_num_seqs: 2
verifier_max_batched_tokens: 8224
verifier_gpu_memory_utilization: 0.90
total_seq_len: 4096
smoke_seq_len: 4096
request_timeout: 900
max_retries: 3

# One request per verifier gives eight requests cluster-wide. Once a pilot is
# stable, raise this value to 2 (verifier_max_num_seqs is already 2) to run up
# to sixteen requests cluster-wide; watch verifier memory and shared-storage I/O.
offline_collection_concurrency: 1
offline_collection_max_samples: 0
offline_validation_samples: 8

# Required by the shared schema but unused by collection-only commands.
epochs: 5
fsdp_skip_initial_broadcast: true
startup_heartbeat_seconds: 30
trainer_mode: trainer
trainer_data_mode: offline
smoke_run_id: offline-collection-unused

install_speculators_verifier: false
install_speculators_trainer: false
