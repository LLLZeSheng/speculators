# Site profile for training from the completed subset of the Nuoya 4K cache.
# Verifier nodes are listed only so the manager can run cache validation inside
# verifier0's existing container. The `offline` command never starts or calls a
# verifier and never launches a collector.
version: 1
cluster_name: glm52-partial-offline-mtp3-4v4t-4k

verifier_ips:
  - 7.150.8.73
  - 7.150.8.125
  - 7.150.9.19
  - 7.150.9.235
trainer_ips:
  - 7.150.10.104
  - 7.150.12.237
  - 7.150.13.255
  - 7.150.15.107

container_image: quay.io/ascend/vllm-ascend:v0.23.0rc1-a3
container_mode: existing
existing_container_name: glm52-w4a8-mg13-speculator-training-lzs
container_name_prefix: glm52-w4a8-mg13-mtp3-partial-offline-4k
container_repo_path: /mnt/xds/mtp/spec_train/speculators
repo_path: /mnt/xds/mtp/spec_train/speculators
shared_root: /mnt/xds/mtp
nic_name: auto

container_mounts:
  - /mnt/xds/sfs:/mnt/xds/sfs
  - /mnt/xds/mtp:/mnt/xds/mtp
  - /mnt/xds/mtp/spec_train/speculators:/mnt/xds/mtp/spec_train/speculators
  - /root/.cache:/root/.cache

verifier_model_path: /mnt/xds/sfs/l00936201/glm52-w4a8-mg13/v1-ascend-modelslim-v4
verifier_source_model_path: /mnt/xds/sfs/GLM-5.2-W4A8-MG13/v1
verifier_quantization_mode: ascend
mtp_init_model_path: /mnt/xds/sfs/l00936201/glm52-w4a8-mg13/v1-ascend-modelslim-v4
data_path: /mnt/xds/mtp/spec_train/dataset/hf/nuoya-first5-long1-4k-partial-offline
hidden_states_path: /mnt/xds/mtp/spec_train/hidden_states/glm52-w4a8-mg13-offline-4k
output_path: /mnt/xds/mtp/spec_train/ckpts/glm52-w4a8-mg13-mtp3-partial-offline-4k
log_root: /mnt/xds/mtp/spec_train/logs/glm52-w4a8-mg13-mtp3-partial-offline-4k

# Offline training does not consume these verifier runtime settings. They stay
# valid so the common cluster schema and launcher can be reused unchanged.
verifier_port: 8077
verifier_dp_size: 1
verifier_tp_size: 16
verifier_block_size: 128
verifier_max_model_len: 4097
verifier_max_num_seqs: 1
verifier_max_batched_tokens: 4112
verifier_gpu_memory_utilization: 0.62

dashboard_host: 0.0.0.0
dashboard_port: 6008
dashboard_auto_start: false

num_speculative_steps: 3
total_seq_len: 4096
smoke_seq_len: 4096
smoke_samples: 256
request_timeout: 900
max_retries: 0
num_workers: 1
prefetch_factor: 1

# The complete filtered-dataset/file mapping is checked before torchrun starts;
# this controls how many files are additionally opened for token-level checks.
offline_collection_concurrency: 1
offline_collection_write_concurrency: 1
offline_collection_schedule: static
offline_collection_claim_timeout: 2400
offline_collection_poll_interval: 30
offline_collection_max_samples: 0
offline_validation_samples: 32

epochs: 5
fsdp_skip_initial_broadcast: true
fsdp_wrap_policy: memory_efficient
fsdp_min_numel: 8000000
fsdp_experts_per_unit: 2
mtp_logits_chunk_size: 128
mtp_activation_checkpointing: false
mtp_training_strategy: sampled_step
memory_log_freq: 1
startup_heartbeat_seconds: 30
trainer_mode: trainer
trainer_data_mode: offline
smoke_run_id: partial-offline-4k

install_speculators_verifier: false
install_speculators_trainer: false
