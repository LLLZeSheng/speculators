# User-maintained source of truth for four verifier and four trainer hosts.
# The manager validates and reads this file; it never generates or rewrites it.
# For two trainer hosts, use mtp_glm52_ascend_online_4v2t.example.yaml instead.
version: 1
cluster_name: glm52-online-mtp3

verifier_ips:
  - FILL_VERIFIER_0_IP
  - FILL_VERIFIER_1_IP
  - FILL_VERIFIER_2_IP
  - FILL_VERIFIER_3_IP
trainer_ips:
  - FILL_TRAINER_0_IP
  - FILL_TRAINER_1_IP
  - FILL_TRAINER_2_IP
  - FILL_TRAINER_3_IP

container_image: quay.io/ascend/vllm-ascend:v0.23.0rc1-a3
container_mode: create
# Only existing mode needs this additional entry:
# existing_container_name: glm52-w4a8-mg13-speculator-training
container_name_prefix: glm52-w4a8-mg13-speculator-training
container_repo_path: /mnt/xds/mtp/spec_train/speculators
repo_path: /mnt/xds/mtp/spec_train/speculators
shared_root: /mnt/xds/mtp
nic_name: auto

# Used only when container_mode=create. Add more host:container[:ro|rw] entries
# here as needed. Paths are not inferred or rewritten by the manager.
container_mounts:
  - /mnt/xds/sfs:/mnt/xds/sfs
  - /mnt/xds/mtp:/mnt/xds/mtp
  - /mnt/xds/mtp/spec_train/speculators:/mnt/xds/mtp/spec_train/speculators
  - /root/.cache:/root/.cache

verifier_model_path: /mnt/xds/sfs/l00936201/glm52-w4a8-mg13/v1-ascend-modelslim-v4
verifier_source_model_path: /mnt/xds/sfs/GLM-5.2-W4A8-MG13/v1
verifier_quantization_mode: ascend
mtp_init_model_path: /mnt/xds/sfs/l00936201/glm52-w4a8-mg13/v1-ascend-modelslim-v4
data_path: /mnt/xds/mtp/spec_train/dataset/hf/nuoya-average2k8k-32k
hidden_states_path: /mnt/xds/mtp/spec_train/hidden_states/glm52-w4a8-mg13-online
output_path: /mnt/xds/mtp/spec_train/ckpts/glm52-w4a8-mg13
log_root: /mnt/xds/mtp/spec_train/logs/glm52-w4a8-mg13

# Read-only dashboard running on the control node. It reads shared logs and
# probes verifier /health endpoints; no package is installed in the containers.
dashboard_host: 0.0.0.0
dashboard_port: 6007
dashboard_auto_start: true

verifier_port: 8077
verifier_dp_size: 1
verifier_tp_size: 16
verifier_block_size: 128
verifier_max_model_len: 32769
verifier_max_num_seqs: 1
# TP16 sequence parallel pads 32769 to the next multiple of 16.
verifier_max_batched_tokens: 32784
total_seq_len: 32768
request_timeout: 900
max_retries: 3
epochs: 5
fsdp_skip_initial_broadcast: true
fsdp_wrap_policy: memory_efficient
fsdp_min_numel: 8000000
mtp_logits_chunk_size: 1024
mtp_activation_checkpointing: false
startup_heartbeat_seconds: 30
trainer_mode: smoke
trainer_data_mode: online-cache
smoke_run_id: FILL_UNIQUE_SMOKE_ID

# The launcher exports both source trees through PYTHONPATH. Keep editable pip
# installation disabled because vLLM 0.23 requires setuptools<81 while this
# repository's build isolation requires setuptools>=82.
install_speculators_verifier: false
install_speculators_trainer: false
